[tool.poetry]
name = "chess_analysis_pkg"
version = "0.1.0"
description = "Analyse my chess.com games"
authors = ["Louis Auger <jammyninja95@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
pandas = "^2.2.3"
requests = "^2.32.3"
matplotlib = "^3.10.1"
seaborn = "^0.13.2"
plotly = "^6.0.1"
statsmodels = "^0.14.4"
scikit-learn = "^1.6.1"
streamlit = "^1.43.2"
uvicorn = "^0.34.0"
fastapi = "^0.115.11"


[tool.poetry.group.dev.dependencies]
python-dotenv = "^1.0.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
requires-python = ">=3.10"
